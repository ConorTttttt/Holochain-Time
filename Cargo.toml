[workspace]
resolver = "2"
members = [
    "crates/vtime_core",
    "crates/vtime_oracle_state",
    "dnas/vtime/zomes/integrity/vtime_integrity",
    "dnas/vtime/zomes/coordinator/vtime",
    "unyt/harness",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://example.invalid/hc-vtime"

[workspace.dependencies]
# Pinned to the current Holochain 0.7 line (HDK 0.7.1 / HDI 0.8.1, published 14 Oct 2026).
# Pin with `=` because these crates define the host/guest interface.
hdi = "=0.8.1"
hdk = "=0.7.1"
# The entry and properties derive macros expand to paths in this crate.
holochain_serialized_bytes = "=0.0.57"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_bytes = { version = "0.11", default-features = false, features = ["alloc"] }
# Same rmp-serde version holochain_serialized_bytes 0.0.57 uses, so statement
# signing bytes match what `hdk::sign` / `hdi::verify_signature` produce.
rmp-serde = "=1.3.0"
sha2 = { version = "0.10", default-features = false }
# Holochain hash text carries a 4-byte location checksum derived with BLAKE2b-128.
blake2b_simd = { version = "1.0", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
vtime_core = { path = "crates/vtime_core", default-features = false }
vtime_integrity = { path = "dnas/vtime/zomes/integrity/vtime_integrity" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
