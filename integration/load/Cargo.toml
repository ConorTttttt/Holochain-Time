# Standalone load harness that reuses the pinned conductor fixture library.
# Keep package/dependency names aligned with integration/conductor/Cargo.lock.
[package]
name = "hc-vtime-conductor-smoke"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "../conductor/src/lib.rs"

[dependencies]
vtime_core = { path = "../../crates/vtime_core" }
roughenough-server = { version = "=2.2.0", features = ["test-utils"] }
roughenough-keys = "=2.2.0"
roughenough-protocol = "=2.2.0"
base64 = "=0.22.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Needed by the library (resilience module uses holochain::prelude types).
holochain = { version = "=0.7.1", default-features = false, features = ["encryption", "wasmer-sys-cranelift", "test_utils"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
futures = "0.3"
